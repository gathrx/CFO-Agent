steps:
  # Build and push backend
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/cfo-backend:$COMMIT_SHA
      - ./backend

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/cfo-backend:$COMMIT_SHA

  # Deploy backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cfo-backend
      - --image=gcr.io/$PROJECT_ID/cfo-backend:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID
      - --set-secrets=GOOGLE_API_KEY=gemini-api-key:latest
      - --memory=512Mi
      - --cpu=1

  # Build frontend
  - name: "node:20-alpine"
    dir: "frontend"
    entrypoint: sh
    args:
      - -c
      - "npm ci && npm run build"
    env:
      - NEXT_PUBLIC_API_URL=https://cfo-backend-$PROJECT_NUMBER.asia-south1.run.app

images:
  - gcr.io/$PROJECT_ID/cfo-backend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

